<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Members - Glassmorphism</title>
    <style>
        /* --- 1. Reset & Core Variables --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gold: #fbbf24;
            --silver: #e2e8f0;
            --bronze: #b45309;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            min-height: 200vh;
            /* Made tall so you can test scrolling */
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* --- 2. Layout & Section --- */
        .leaderboard-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            perspective: 1000px;
            /* Essential for 3D feel */
        }

        .title {
            font-size: 2.5rem;
            margin-bottom: 4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            /* Hidden initially for scroll anim */
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .cards-container {
            display: flex;
            align-items: flex-end;
            /* Aligns them at the bottom so heights differ */
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* --- 3. Glassmorphism Card Styling --- */
        .member-card {
            position: relative;
            width: 240px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);

            /* Initial State for Scroll Animation */
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- 4. Content Styling --- */
        .avatar-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 0, 0, 0.2);
        }

        .rank-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #0f172a;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .role {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* --- 5. Specific Ranking Styles --- */

        /* Rank 1 (Middle) */
        .card-rank-1 {
            width: 280px;
            /* Bigger */
            padding: 3rem 1.5rem;
            z-index: 2;
            background: rgba(255, 255, 255, 0.08);
            /* Slightly lighter */
            box-shadow: 0 0 50px rgba(96, 165, 250, 0.15);
        }

        .card-rank-1 .rank-badge {
            background: var(--gold);
        }

        .card-rank-1 .avatar-box {
            width: 120px;
            height: 120px;
        }

        /* Rank 2 (Left) */
        .card-rank-2 {
            order: -1;
        }

        /* Flexbox trick to put it left */
        .card-rank-2 .rank-badge {
            background: var(--silver);
        }

        /* Rank 3 (Right) */
        .card-rank-3 {
            order: 1;
        }

        .card-rank-3 .rank-badge {
            background: var(--bronze);
        }


        /* --- 6. Interactions (Hover & Scroll) --- */

        /* Hover Effect: Rotate and Scale */
        .member-card:hover {
            transform: translateY(-20px) rotate(3deg) scale(1.05) !important;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            z-index: 10;
        }

        /* Scroll Active State (Added via JS) */
        .active .title {
            opacity: 1;
            transform: translateY(0);
        }

        .active .member-card {
            opacity: 1;
            transform: translateY(0);
        }

        /* Staggered delay for scroll animation */
        .active .card-rank-2 {
            transition-delay: 0.1s;
        }

        .active .card-rank-1 {
            transition-delay: 0.3s;
        }

        /* Middle pops up last/distinctly */
        .active .card-rank-3 {
            transition-delay: 0.5s;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .cards-container {
                align-items: center;
                flex-direction: column;
            }

            .card-rank-2 {
                order: 2;
            }

            .card-rank-1 {
                order: 1;
            }

            .card-rank-3 {
                order: 3;
            }
        }
    </style>
</head>

<body>

    <div class="scroll-instruction" style="text-align:center; padding-top: 50px; opacity: 0.5;">
        <p>↓ Scroll down to trigger the animation ↓</p>
    </div>

    <section class="leaderboard-section" id="leaderboard">
        <h1 class="title">Top Performers</h1>

        <div class="cards-container">

            <div class="member-card card-rank-1">
                <div class="avatar-box">
                    <img src="https://i.pravatar.cc/150?img=12" alt="Member">
                    <div class="rank-badge">1</div>
                </div>
                <div class="name">Sarah Jenkins</div>
                <div class="role">Senior Developer</div>
            </div>

            <div class="member-card card-rank-2">
                <div class="avatar-box">
                    <img src="https://i.pravatar.cc/150?img=33" alt="Member">
                    <div class="rank-badge">2</div>
                </div>
                <div class="name">David Chen</div>
                <div class="role">UI Designer</div>
            </div>

            <div class="member-card card-rank-3">
                <div class="avatar-box">
                    <img src="https://i.pravatar.cc/150?img=59" alt="Member">
                    <div class="rank-badge">3</div>
                </div>
                <div class="name">Emily Ross</div>
                <div class="role">Product Manager</div>
            </div>

        </div>
    </section>

    <script>
        // --- Interactive Scroll Logic ---

        // We use IntersectionObserver to detect when the section is in view
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Add class 'active' when section enters viewport
                    entry.target.classList.add('active');
                }
            });
        }, {
            threshold: 0.3 // Trigger when 30% of the section is visible
        });

        // Target the section
        const section = document.getElementById('leaderboard');
        observer.observe(section);
    </script>
</body>

</html>
